[project]
name = "agent-bus-coord"
version = "0.3.1"
description = "Protocolo de comunicacion entre agentes IA sin dependencia de tmux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yasmany Castillo", email = "yasmany003@gmail.com" }
]
keywords = ["ai-agents", "coordination", "mcp", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "websockets>=13.0",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "PyNaCl>=1.5",
    "click>=8.1",
    "rich>=13.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp==2.1.1",
    "anyio>=4.9",
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/yasmanycastillo/agent-bus"
Repository = "https://github.com/yasmanycastillo/agent-bus"
Issues = "https://github.com/yasmanycastillo/agent-bus/issues"
Changelog = "https://github.com/yasmanycastillo/agent-bus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "mypy>=1.12",
]

[project.scripts]
agent-bus = "agent_bus.cli.main:app"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bus"]

# Explicit list: hatchling also packs untracked files that .gitignore misses.
[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/scripts", "/config", "/examples", "/hooks",
  "/*.md", "/LICENSE", "/uv.lock", "/mypy-baseline.json", "/.python-version",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
