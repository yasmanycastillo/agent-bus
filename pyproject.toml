[project]
name = "agent-bus"
version = "0.1.0"
description = "Protocolo de comunicacion entre agentes IA sin dependencia de tmux"
readme = "README.md"
authors = [
    { name = "Yasmany Castillo", email = "yasmany003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "websockets>=13.0",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "PyNaCl>=1.5",
    "click>=8.1",
    "rich>=13.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.12",
]

[project.scripts]
agent-bus = "agent_bus.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
