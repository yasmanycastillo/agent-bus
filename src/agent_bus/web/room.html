<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>agent-bus — War Room</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace,monospace; display:grid; grid-template-columns:340px 1fr; grid-template-rows:48px 1fr; height:100vh; }
  header { grid-column:1/3; display:flex; align-items:center; gap:16px; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; color:var(--accent); }
  #status { margin-left:auto; font-size:12px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:4px; }
  aside { background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:12px; }
  main { display:grid; grid-template-rows:auto 1fr; overflow:hidden; }
  #kanban { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:12px; overflow-x:auto; }
  .col { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px; min-height:120px; }
  .col h3 { font-size:11px; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:8px; margin-bottom:6px; font-size:12px; }
  .card .owner { color:var(--warn); font-size:11px; }
  .card select { width:100%; margin-top:6px; background:var(--bg); color:var(--text); border:1px solid var(--border); font-size:11px; }
  #feed-wrap { display:flex; flex-direction:column; border-top:1px solid var(--border); min-height:0; }
  #feed-wrap h2 { font-size:12px; padding:8px 12px; color:var(--accent); }
  #feed { flex:1; overflow-y:auto; padding:0 12px 12px; font-size:12px; }
  .evt { padding:4px 0; border-bottom:1px solid var(--border); opacity:.9; }
  .evt time { color:#8b949e; margin-right:8px; font-size:11px; }
  #composer { padding:12px; border-top:1px solid var(--border); background:var(--panel); }
  #composer textarea { width:100%; height:54px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:8px; font:inherit; }
  #composer .row { display:flex; gap:8px; margin-top:6px; }
  #composer select, #composer button { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px 10px; font:inherit; }
  #composer button { background:var(--accent); color:#0d1117; font-weight:bold; cursor:pointer; }
  .approvals { margin:8px 0; padding:8px; border:1px solid var(--warn); border-radius:6px; }
  .approvals button { margin-right:6px; cursor:pointer; }
  h2.sec { margin:16px 0 8px; font-size:12px; color:var(--accent); }
  .agent { display:flex; justify-content:space-between; padding:4px 0; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🚌 agent-bus — War Room</h1>
  <form id="login-form">
    <label>Sesión admin <input id="session-token" type="password" autocomplete="off" placeholder="Token de sesión"></label>
    <button type="submit">Conectar</button>
  </form>
  <button id="logout" hidden>Cerrar sesión</button>
  <span id="status">Conecta una sesión admin. El token solo se conserva en memoria.</span>
</header>
<aside>
  <h2 class="sec">Aprobaciones pendientes (<span id="ap-count">0</span>)</h2>
  <div id="approvals"></div>
  <h2 class="sec">Agentes</h2>
  <div id="agents"></div>
  <h2 class="sec">Locks activos</h2>
  <div id="locks"></div>
</aside>
<main>
  <div id="kanban"></div>
  <div id="feed-wrap">
    <h2>📡 Feed en vivo</h2>
    <div id="feed"></div>
    <div id="composer">
      <textarea id="msg-text" placeholder="Mensaje del humano..."></textarea>
      <div class="row">
        <select id="msg-to"><option value="*">Broadcast</option></select>
        <label><input type="checkbox" id="msg-reply"> requiere respuesta</label>
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = '', principal = null, streamController = null, refreshTimer = null, eventCursor = null;
const COLS = ['pending','in_progress','in_review','blocked','done'];

function report(error) {
  if (error.name !== 'AbortError') $('status').textContent = error.message || 'Error de conexión';
}
async function api(path, options = {}) {
  if (!token) throw new Error('Conecta una sesión admin primero');
  const sessionToken = token;
  const response = await fetch(path, {...options, headers: {
    'Content-Type': 'application/json', ...options.headers, 'Authorization': `Bearer ${sessionToken}`,
  }});
  if (token !== sessionToken) throw new DOMException('Sesión cerrada', 'AbortError');
  if (!response.ok) {
    if (response.status === 401 || response.status === 403) signOut();
    throw new Error(`Solicitud rechazada (${response.status}). Revisa la sesión y sus permisos.`);
  }
  const data = await response.json();
  if (token !== sessionToken) throw new DOMException('Sesión cerrada', 'AbortError');
  return data;
}
function signOut() {
  token = ''; principal = null; eventCursor = null;
  if (streamController) streamController.abort();
  streamController = null;
  clearInterval(refreshTimer); refreshTimer = null;
  $('session-token').value = '';
  $('login-form').hidden = false; $('logout').hidden = true;
  for (const id of ['kanban','agents','locks','approvals','feed']) $(id).replaceChildren();
  $('msg-to').replaceChildren(new Option('Broadcast', '*'));
  $('msg-text').value = ''; $('ap-count').textContent = '0';
  $('status').textContent = 'Sesión cerrada';
}
$('logout').onclick = signOut;
$('login-form').onsubmit = async event => {
  event.preventDefault();
  const entered = $('session-token').value.trim();
  signOut(); token = entered;
  try {
    principal = await api('/auth/me');
    if (principal.role !== 'admin') throw new Error('War Room requiere una sesión con rol admin');
    $('login-form').hidden = true; $('logout').hidden = false;
    await refresh();
    streamController = new AbortController();
    streamEvents(streamController.signal).catch(report);
    refreshTimer = setInterval(() => refresh().catch(report), 15000);
  } catch (error) { signOut(); report(error); }
};
function renderOverview(d) {
  const kb = $('kanban'); kb.replaceChildren();
  for (const col of COLS) {
    const div = document.createElement('div'); div.className = 'col';
    div.innerHTML = `<h3>${col} (${d.tasks.filter(t=>t.status===col).length})</h3>`;
    for (const t of d.tasks.filter(t=>t.status===col)) {
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<b>${esc(t.task_id)}</b> ${esc(t.title)}<div class="owner">${esc(t.owner)}</div>`;
      const sel = document.createElement('select');
      sel.add(new Option('reasignar…', ''));
      for (const a of d.agents) sel.add(new Option(a.agent_id, a.agent_id));
      sel.onchange = () => sel.value && api('/room/api/assign', {method:'POST', body:JSON.stringify({task_id:t.task_id, agent_id:sel.value})}).then(refresh).catch(report);
      card.appendChild(sel); div.appendChild(card);
    }
    kb.appendChild(div);
  }
  $('agents').innerHTML = d.agents.map(a=>`<div class="agent"><span>${esc(a.agent_id)}</span><span>${esc(a.status)}</span></div>`).join('') || '<i>ninguno</i>';
  $('locks').innerHTML = d.locks.map(l=>`<div class="agent"><span>${esc(l.file_path)}</span><span>${esc(l.locked_by)}</span></div>`).join('') || '<i>ninguno</i>';
  const current = $('msg-to').value;
  $('msg-to').replaceChildren(new Option('Broadcast', '*'));
  for (const a of d.agents) $('msg-to').add(new Option(a.agent_id, a.agent_id));
  $('msg-to').value = [...$('msg-to').options].some(o=>o.value===current) ? current : '*';
}
async function renderApprovals() {
  const aps = await api('/room/api/pending-approvals');
  $('ap-count').textContent = aps.length;
  $('approvals').replaceChildren();
  for (const m of aps.slice(0,5)) {
    const div = document.createElement('div'); div.className = 'approvals';
    const text = document.createElement('p');
    text.textContent = `${m.from_agent}: ${JSON.stringify(m.body).slice(0,120)}`;
    div.appendChild(text);
    for (const decision of ['approve','reject']) {
      const button = document.createElement('button'); button.textContent = decision;
      button.onclick = () => api('/room/api/approve', {method:'POST', body:JSON.stringify({message_id:m.message_id, decision, note:''})}).then(renderApprovals).catch(report);
      div.appendChild(button);
    }
    $('approvals').appendChild(div);
  }
}
async function refresh() {
  if (!principal) return;
  const overview = await api('/room/api/overview');
  renderOverview(overview);
  await renderApprovals();
}
async function sendMessage() {
  const text = $('msg-text').value.trim(); if (!text) return;
  try {
    await api('/room/api/message', {method:'POST', body:JSON.stringify({to_agent:$('msg-to').value, text, reply_needed:$('msg-reply').checked})});
    $('msg-text').value = '';
  } catch (error) { report(error); }
}
function renderEvent(data) {
  let event;
  event = JSON.parse(data);
  const div = document.createElement('div'); div.className = 'evt';
  div.textContent = `${new Date().toLocaleTimeString()} ${event.from_agent||'?'} → ${event.to_agent||'*'}: ${JSON.stringify(event.body ?? {}).slice(0,140)}`;
  $('feed').prepend(div);
  while ($('feed').children.length > 200) $('feed').lastChild.remove();
}
async function recoverEvents(control, signal) {
  if (control.error !== 'cursor_expired' || typeof control.cursor !== 'string' || !control.cursor)
    throw new Error('Control de recuperación inválido');
  await refresh();
  if (!signal.aborted) eventCursor = control.cursor;
}
async function dispatchFrame(frame, signal) {
  if (signal.aborted) return false;
  if (frame.event === 'reset') {
    await recoverEvents(JSON.parse(frame.data), signal);
    return false;
  }
  if (frame.event === 'checkpoint') {
    const checkpoint = JSON.parse(frame.data);
    const cursor = frame.id || checkpoint.cursor;
    if (typeof cursor !== 'string' || !cursor) throw new Error('Checkpoint inválido');
    eventCursor = cursor;
    return true;
  }
  renderEvent(frame.data);
  if (frame.id !== null) eventCursor = frame.id;
  return true;
}
async function streamEvents(signal) {
  while (!signal.aborted && token) {
    try {
      const headers = {Authorization:`Bearer ${token}`};
      if (eventCursor !== null) headers['Last-Event-ID'] = eventCursor;
      const response = await fetch('/events/all', {headers, signal});
      if (response.status === 410) {
        await recoverEvents(await response.json(), signal);
      } else {
        if (!response.ok) {
          if (response.status === 401 || response.status === 403) signOut();
          if (response.status === 422) {
            report(new Error('Cursor de eventos inválido. Cierra y vuelve a conectar la sesión.'));
            return;
          }
          throw new Error(`Eventos rechazados (${response.status})`);
        }
        if (signal.aborted) return;
        $('status').textContent = `SSE conectado — ${principal.agent_id}`;
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '', data = [], event = 'message', id = null, size = 0, continuing = true;
        try {
          while (!signal.aborted && continuing) {
            const chunk = await reader.read(); if (chunk.done) break;
            buffer += decoder.decode(chunk.value, {stream:true});
            let end;
            while ((end = buffer.indexOf('\n')) >= 0) {
              const line = buffer.slice(0,end).replace(/\r$/, ''); buffer = buffer.slice(end+1);
              size += line.length + 1;
              if (size > 262144) throw new Error('Frame SSE demasiado grande');
              if (!line) {
                if (data.length) continuing = await dispatchFrame({event, id, data:data.join('\n')}, signal);
                data = []; event = 'message'; id = null; size = 0;
                if (!continuing) break;
              } else if (!line.startsWith(':')) {
                const colon = line.indexOf(':');
                const field = colon < 0 ? line : line.slice(0,colon);
                let value = colon < 0 ? '' : line.slice(colon+1);
                if (value.startsWith(' ')) value = value.slice(1);
                if (field === 'data') data.push(value);
                else if (field === 'event') event = value || 'message';
                else if (field === 'id' && !value.includes('\0')) id = value;
              }
            }
            if (buffer.length + size > 262144) throw new Error('Frame SSE demasiado grande');
          }
          // A final partial frame is discarded; its cursor is replayed after reconnect.
        } finally { await reader.cancel(); reader.releaseLock(); }
      }
    } catch (error) {
      if (signal.aborted) return;
      report(error);
    }
    // Back off after errors AND clean EOF; stop wakes this delay immediately.
    if (!signal.aborted && token) await new Promise(resolve => {
      const timer = setTimeout(done, 1000);
      function done() { clearTimeout(timer); signal.removeEventListener('abort', done); resolve(); }
      signal.addEventListener('abort', done, {once:true});
    });
  }
}
</script>
</body>
</html>
